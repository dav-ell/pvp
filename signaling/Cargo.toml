[package]
name = "pvp-signaling"
version = "0.3.25"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
futures-util = "0.3"
libc = "0.2"
url = "2"
regex = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
