[package]
name = "pvp"
version = "0.1.0"
edition = "2021"
default-run = "pvp"
autobins = false

[[bin]]
name = "pvp"
path = "src/desktop.rs"

[[bin]]
name = "pvp-legacy"
path = "src/main.rs"
required-features = ["legacy"]

[features]
default = []
legacy = ["dep:aes", "dep:cbc", "dep:opencv", "dep:openh264", "dep:rand", "dep:tokio", "dep:byteorder", "dep:hex", "dep:stun-rs", "dep:cpal", "dep:opus", "dep:ringbuf", "dep:rubato"]

[dependencies]
hmac = "0.12"
sha2 = "0.10"
aes = { version = "0.8.4", optional = true }
cbc = { version = "0.1.2", optional = true }
opencv = { version = "=0.94.4", features = ["clang-runtime"], optional = true }
openh264 = { version = "0.8.1", features = ["source"], optional = true }
rand = { version = "0.8", optional = true }
serde_json = "1.0"
tokio = { version = "1.44.2", features = ["full"], optional = true }
# crossbeam = "0.8.4" # No longer directly needed, tokio/std channels are sufficient
byteorder = { version = "1.5", optional = true }
hex = { version = "0.4", optional = true }
stun-rs = { version = "0.1.11", optional = true }

# Audio dependencies
cpal = { version = "0.15.3", optional = true }
opus = { version = "0.3.0", optional = true }
ringbuf = { version = "0.5.2", optional = true }
rubato = { version = "0.16.2", optional = true }

[build-dependencies]
pkg-config = "0.3"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"
