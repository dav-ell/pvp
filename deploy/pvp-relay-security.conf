# Install as /etc/systemd/system/pvp-relay.service.d/security.conf.
# Create the dedicated system user pvp-relay first. Preserve EnvironmentFile,
# game backend routing and listening ports in the existing app-owned unit.
[Service]
User=pvp-relay
Group=pvp-relay
NoNewPrivileges=true
ProtectSystem=strict
ProtectHome=true
PrivateTmp=true
PrivateDevices=true
UMask=0077
LimitCORE=0
LimitNOFILE=1024
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
