[package]
name = "pvp-relay"
version = "0.1.0"
edition = "2021"
description = "Lightweight UDP media relay (TURN-like) for pvp peer calls"
publish = false

[[bin]]
name = "pvp-relay"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.44.2", features = ["full"] }

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"
